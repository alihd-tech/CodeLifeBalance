name: Release hardening and v1 smoke test\n\non:\n  workflow_dispatch:\n  push:\n    branches:\n      - main\n    paths:\n      - ".github/workflows/release-hardening-smoke.yml"\n\npermissions:\n  contents: write\n\njobs:\n  release-and-smoke:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Point published release back to v1.0.0\n        env:\n          GH_TOKEN: ${{ github.token }}\n        run: |\n          gh api --method PATCH \\n            "repos/${GITHUB_REPOSITORY}/releases/393218009" \\n            -f tag_name="v1.0.0" \\n            -f name="Code Life Balance v1.0.0"\n\n      - name: Checkout smoke-test workspace\n        uses: actions/checkout@v4\n\n      - name: Run published Code Life Balance Action\n        uses: alihd-tech/CodeLifeBalance@v1\n        with:\n          github-token: ${{ secrets.GITHUB_TOKEN }}\n          username: alihd-tech\n          timezone: Europe/Helsinki\n          workday-start: "9"\n          workday-end: "18"\n          theme: dark\n          card-style: detailed\n          formats: svg,json,markdown\n          output-dir: code-life-balance-smoke\n          commit: "false"\n\n      - name: Verify generated artifacts\n        run: |\n          test -s code-life-balance-smoke/code-life.svg\n          test -s code-life-balance-smoke/stats.json\n          test -s code-life-balance-smoke/report.md\n          node -e 'const r=require("./code-life-balance-smoke/stats.json"); if(r.schemaVersion!==1) process.exit(1); console.log("score", r.analysis.balanceScore)'\n\n      - name: Upload smoke-test report\n        uses: actions/upload-artifact@v4\n        with:\n          name: code-life-balance-v1-smoke\n          path: code-life-balance-smoke\n