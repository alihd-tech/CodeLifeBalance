name: Release hardening and v1 smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-hardening-smoke.yml"

permissions:
  contents: write

jobs:
  release-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Point published release back to v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/393218009" \
            -f tag_name="v1.0.0" \
            -f name="Code Life Balance v1.0.0"

      - name: Checkout smoke-test workspace
        uses: actions/checkout@v4

      - name: Run published Code Life Balance Action
        uses: alihd-tech/CodeLifeBalance@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: alihd-tech
          timezone: Europe/Helsinki
          workday-start: "9"
          workday-end: "18"
          theme: dark
          card-style: detailed
          formats: svg,json,markdown
          output-dir: code-life-balance-smoke
          commit: "false"

      - name: Verify generated artifacts
        run: |
          test -s code-life-balance-smoke/code-life.svg
          test -s code-life-balance-smoke/stats.json
          test -s code-life-balance-smoke/report.md
          node -e 'const r=require("./code-life-balance-smoke/stats.json"); if(r.schemaVersion!==1) process.exit(1); console.log("score", r.analysis.balanceScore)'

      - name: Upload smoke-test report
        uses: actions/upload-artifact@v4
        with:
          name: code-life-balance-v1-smoke
          path: code-life-balance-smoke
