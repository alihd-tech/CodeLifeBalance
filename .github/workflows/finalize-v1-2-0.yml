name: Finalize v1.2.0 assets and smoke test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-v1-2-0.yml

permissions:
  contents: write

jobs:
  npm-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v1.2.0
        uses: actions/checkout@v5
        with:
          ref: v1.2.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build npm package tarball
        id: pack
        run: |
          pnpm build:npm-cli
          TARBALL=$(npm pack ./dist/npm --silent | tail -n 1)
          test -s "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Attach npm tarball to v1.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.2.0 "${{ steps.pack.outputs.tarball }}" --clobber

  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run public v1 Action
        uses: alihd-tech/CodeLifeBalance@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          timezone: UTC
          theme: dark
          card-style: compact
          formats: svg,json,markdown
          output-dir: .tmp/v1-smoke
          commit: "false"

      - name: Verify public v1 outputs
        run: |
          test -s .tmp/v1-smoke/code-life.svg
          test -s .tmp/v1-smoke/stats.json
          test -s .tmp/v1-smoke/report.md
