name: Move v1 to v1.1.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1-1-0.yml

permissions:
  contents: write

jobs:
  move-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Move v1 alias
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v1 b0fa26902556ecde56cf8e0aa22b8f0d517b30a1
          git push origin refs/tags/v1 --force
