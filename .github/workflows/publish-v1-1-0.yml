name: Publish v1.1.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1-1-0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v1.1.0
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: b0fa26902556ecde56cf8e0aa22b8f0d517b30a1
        shell: bash
        run: |
          gh release create v1.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "Code Life Balance v1.1.0" \
            --notes-file - <<'EOF'
          ## Code Life Balance v1.1.0

          This compatible v1 release hardens the published Action and adds the optional GitHub App foundation.

          ### Highlights
          - Node 24 GitHub Action runtime
          - permanent tests, strict typecheck, production build, and Action self-test CI
          - recurring published-v1 smoke testing
          - secure production session-secret handling
          - optional GitHub App installation verification and short-lived installation tokens
          - HMAC-verified GitHub App webhooks
          - installation repository and optional organization/team discovery
          - opt-in minimal persistent webhook history for self-hosted deployments
          - privacy, support, security, setup, and changelog documentation

          Existing workflows can continue using:

          ```yaml
          uses: alihd-tech/CodeLifeBalance@v1
          ```
          EOF
